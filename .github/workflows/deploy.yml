name: Build and Deploy

# main への push で GitHub Pages に公開する。
# パブリックリポジトリなら Actions の実行時間も Pages のホスティングも無料枠で、
# このアプリはサーバーを持たないので運用コストは発生しない。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 型チェック
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: テスト
        run: npm test

  build:
    # main への push のときだけ公開用のビルドをする
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 静的サイトをビルド
        env:
          # プロジェクトページは /<リポジトリ名>/ 配下に配信されるため
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      # 将来ブランチ配信に切り替えても _next/ が無視されないようにしておく
      - name: .nojekyll を置く
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
