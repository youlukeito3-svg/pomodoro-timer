name: Build and Deploy

# main への push で GitHub Pages に公開する。
#
# 配信元は gh-pages ブランチ。Actions のアーティファクトから配信する方式
# （actions/deploy-pages）は Pages サイトの新規作成にリポジトリ管理者権限が要り、
# ワークフローの GITHUB_TOKEN では
# 「Create Pages site failed: Resource not accessible by integration」で失敗する。
# ブランチ配信なら contents: write だけで完結し、設定画面での操作も不要。
#
# パブリックリポジトリなら Actions の実行時間も Pages のホスティングも無料枠で、
# このアプリはサーバーを持たないので運用コストは発生しない。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # LayoutProps などの型は Next が .next/types に生成するため、
      # tsc の前に next typegen を通す必要がある（npm run typecheck が両方やる）
      - name: 型チェック
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: テスト
        run: npm test

  deploy:
    # main への push のときだけ公開する
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 静的サイトをビルド
        env:
          # プロジェクトページは /<リポジトリ名>/ 配下に配信されるため
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      # これが無いと Jekyll が _next/ を無視して配信されない
      - name: .nojekyll を置く
        run: touch out/.nojekyll

      - name: gh-pages ブランチへ公開
        working-directory: out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          # 毎回1コミットの履歴にする。ビルド成果物なので履歴を残す意味がなく、
          # 積み上げるとリポジトリが際限なく膨らむため強制上書きする。
          git push -q -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" \
            gh-pages
